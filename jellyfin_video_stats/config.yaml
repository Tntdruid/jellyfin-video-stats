name: Jellyfin Video Stats
version: "0.3.1"
slug: jellyfin_video_stats
description: Seerstatistik for film og serier i Jellyfin – top-lister, binge, heatmap og transcoding
url: https://github.com/Tntdruid/jellyfin-video-stats
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:movie-open-play
panel_title: Videostatistik
map:
  - addon_config:rw
options:
  jellyfin_url: "http://2937404c-jellyfin:8096"
  api_key: ""
  poll_interval: 10
  min_watch_percent: 50
  video_folders:
    - Youtube
  user_map: []
schema:
  jellyfin_url: url
  api_key: password
  poll_interval: int(3,60)
  min_watch_percent: int(10,100)
  video_folders:
    - str
  user_map:
    - str

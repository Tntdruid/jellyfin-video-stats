<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#AA5CC3"/>
      <stop offset="1" stop-color="#00A4DC"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2346"/>
      <stop offset="1" stop-color="#17203A"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B70"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- tv -->
  <rect x="64" y="120" width="384" height="264" rx="40" fill="#fff"/>
  <rect x="88" y="144" width="336" height="216" rx="22" fill="url(#screen)"/>
  <rect x="200" y="396" width="112" height="22" rx="11" fill="#fff" opacity="0.9"/>
  <!-- bar chart on the screen -->
  <rect x="124" y="268" width="40" height="64" rx="10" fill="#fff" opacity="0.55"/>
  <rect x="184" y="228" width="40" height="104" rx="10" fill="#fff" opacity="0.7"/>
  <rect x="244" y="248" width="40" height="84" rx="10" fill="#fff" opacity="0.85"/>
  <rect x="304" y="188" width="40" height="144" rx="10" fill="#fff"/>
  <!-- trend line over the bars -->
  <polyline points="144,236 204,196 264,214 324,158" fill="none" stroke="#FFD34D" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- play badge -->
  <circle cx="404" cy="140" r="64" fill="url(#play)" stroke="#fff" stroke-width="10"/>
  <path d="M388 110 L432 140 L388 170 Z" fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
</svg>
